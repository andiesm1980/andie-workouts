<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b30"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="arc" x1="11" y1="24.6" x2="21" y2="6.1" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b2b"/>
      <stop offset="100%" stop-color="#f0407a"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Faint ring track -->
  <path d="M 11.1 24.6 A 9.9 9.9 0 1 1 20.9 24.6"
    fill="none"
    stroke="rgba(255,255,255,0.08)"
    stroke-width="2.5"
    stroke-linecap="round"/>

  <!-- Ring arc -->
  <path d="M 11.1 24.6 A 9.9 9.9 0 1 1 20.9 24.6"
    fill="none"
    stroke="url(#arc)"
    stroke-width="2.5"
    stroke-linecap="round"/>

  <!-- Play triangle — centroid at (16,16) -->
  <polygon points="14.1,12.6 14.1,19.4 19.8,16" fill="white" opacity="0.93"/>
</svg>
