<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b30"/>
      <stop offset="100%" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="arc" x1="177" y1="393" x2="335" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b2b"/>
      <stop offset="100%" stop-color="#f0407a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background (maskable safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Faint ring track -->
  <path d="M 177 392.8 A 158 158 0 1 1 335 392.8"
    fill="none"
    stroke="rgba(255,255,255,0.07)"
    stroke-width="40"
    stroke-linecap="round"/>

  <!-- Glow layer -->
  <path d="M 177 392.8 A 158 158 0 1 1 335 392.8"
    fill="none"
    stroke="url(#arc)"
    stroke-width="40"
    stroke-linecap="round"
    opacity="0.55"
    filter="url(#glow)"/>

  <!-- Sharp ring arc -->
  <path d="M 177 392.8 A 158 158 0 1 1 335 392.8"
    fill="none"
    stroke="url(#arc)"
    stroke-width="40"
    stroke-linecap="round"/>

  <!-- Play triangle — centroid at (256,256) -->
  <polygon points="226,202 226,310 316,256" fill="white" opacity="0.93"/>
</svg>
